<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Smart AI</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #eef1f5 0%,
            #f8f9fb 100%
        );

    color: #111827;

    min-height: 100vh;
}


/* =========================================
   CONTAINER
========================================= */

.container {
    width: 100%;
    max-width: 1200px;

    margin: auto;

    padding:
        25px 16px
        calc(50px + env(safe-area-inset-bottom));
}


/* =========================================
   HEADER
========================================= */

.header {
    text-align: center;

    margin-bottom: 24px;
}

.logo {
    font-size: 40px;

    font-weight: 900;

    letter-spacing: -1.5px;
}

.subtitle {
    margin-top: 6px;

    color: #6b7280;

    font-size: 15px;
}


/* =========================================
   STATUS BAR
========================================= */

.system-bar {

    background: white;

    border-radius: 18px;

    padding: 14px 16px;

    margin-bottom: 18px;

    box-shadow:
        0 7px 25px rgba(0,0,0,0.05);
}

.system-top {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    margin-bottom: 12px;
}

.system-title {

    font-weight: 900;

    font-size: 16px;
}

.remaining {

    font-size: 13px;

    font-weight: 800;

    color: #374151;

    background: #f3f4f6;

    padding: 6px 10px;

    border-radius: 20px;
}

.providers-status {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;
}

.provider-status {

    display: inline-flex;

    align-items: center;

    gap: 6px;

    padding: 6px 10px;

    border-radius: 20px;

    background: #f3f4f6;

    color: #6b7280;

    font-size: 12px;

    font-weight: 800;
}

.provider-status.available {

    background: #dcfce7;

    color: #166534;
}

.provider-status.unavailable {

    background: #fee2e2;

    color: #991b1b;
}

.provider-status.limited {

    background: #fef3c7;

    color: #92400e;
}

.dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: currentColor;
}


/* =========================================
   QUESTION BOX
========================================= */

.question-box {

    background: white;

    border-radius: 24px;

    padding: 18px;

    box-shadow:
        0 10px 35px rgba(0,0,0,0.07);

    margin-bottom: 20px;
}

textarea {

    width: 100%;

    min-height: 125px;

    resize: vertical;

    border:
        2px solid #e5e7eb;

    border-radius: 17px;

    padding: 16px;

    font-family: inherit;

    font-size: 17px;

    line-height: 1.7;

    outline: none;

    direction: rtl;

    text-align: right;

    transition:
        border 0.2s,
        box-shadow 0.2s;
}

textarea:focus {

    border-color: #111827;

    box-shadow:
        0 0 0 3px
        rgba(17,24,39,0.07);
}

textarea::placeholder {

    color: #9ca3af;
}


/* =========================================
   BUTTONS
========================================= */

.button-row {

    display: flex;

    gap: 10px;

    margin-top: 13px;
}

button {

    border: none;

    font-family: inherit;

    font-size: 16px;

    font-weight: 800;

    cursor: pointer;

    border-radius: 14px;

    padding: 14px 20px;

    transition:
        transform 0.15s,
        opacity 0.15s,
        background 0.15s;
}

button:active {

    transform: scale(0.98);
}

.ask-button {

    flex: 1;

    background: #111827;

    color: white;
}

.ask-button:hover {

    background: #1f2937;
}

.ask-button:disabled {

    opacity: 0.55;

    cursor: not-allowed;
}

.clear-button {

    background: #e5e7eb;

    color: #111827;
}

.clear-button:hover {

    background: #dfe2e6;
}


/* =========================================
   LOADING
========================================= */

.loading {

    display: none;

    background: white;

    border-radius: 16px;

    padding: 14px;

    margin-bottom: 18px;

    text-align: center;

    color: #6b7280;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.05);
}

.loading.show {

    display: block;
}

.loading-dot {

    display: inline-block;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #6b7280;

    margin: 0 3px;

    animation:
        pulse 1s infinite;
}

.loading-dot:nth-child(2) {

    animation-delay: 0.15s;
}

.loading-dot:nth-child(3) {

    animation-delay: 0.30s;
}

@keyframes pulse {

    0%, 100% {
        opacity: 0.3;
    }

    50% {
        opacity: 1;
    }
}


/* =========================================
   RESULTS
========================================= */

.results {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 18px;
}


/* =========================================
   CARD
========================================= */

.card {

    background: white;

    border-radius: 22px;

    padding: 18px;

    min-height: 300px;

    display: flex;

    flex-direction: column;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.06);
}

.card-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;

    padding-bottom: 14px;

    border-bottom:
        1px solid #edf0f3;
}

.provider {

    font-size: 22px;

    font-weight: 900;
}

.status {

    font-size: 13px;

    font-weight: 800;

    padding: 6px 11px;

    border-radius: 30px;

    background: #f3f4f6;

    color: #6b7280;

    white-space: nowrap;
}

.status.success {

    background: #dcfce7;

    color: #166534;
}

.status.error {

    background: #fee2e2;

    color: #991b1b;
}

.status.loading-status {

    background: #f3f4f6;

    color: #6b7280;
}


/* =========================================
   ANSWER
========================================= */

.answer-area {

    flex: 1;

    padding-top: 18px;

    display: flex;

    flex-direction: column;
}

.answer {

    white-space: pre-wrap;

    word-break: break-word;

    line-height: 1.9;

    font-size: 17px;

    direction: rtl;

    text-align: right;
}

.error-message {

    color: #991b1b;

    font-size: 16px;

    line-height: 1.8;
}


/* =========================================
   FOOTER
========================================= */

.card-footer {

    margin-top: 18px;

    padding-top: 12px;

    border-top:
        1px solid #edf0f3;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;
}

.model {

    color: #9ca3af;

    font-size: 11px;

    direction: ltr;

    text-align: left;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.copy-button {

    padding: 7px 11px;

    background: #f3f4f6;

    color: #374151;

    font-size: 12px;

    white-space: nowrap;
}

.copy-button:hover {

    background: #e5e7eb;
}


/* =========================================
   EMPTY
========================================= */

.empty {

    grid-column: 1 / -1;

    background: white;

    border-radius: 22px;

    padding: 45px 20px;

    text-align: center;

    color: #9ca3af;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.05);
}

.empty-title {

    color: #374151;

    font-size: 20px;

    font-weight: 800;

    margin-bottom: 8px;
}


/* =========================================
   SUMMARY
========================================= */

.summary {

    grid-column: 1 / -1;

    background: white;

    border-radius: 18px;

    padding: 13px 16px;

    text-align: center;

    color: #6b7280;

    font-size: 14px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.04);
}

.summary strong {

    color: #111827;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 850px) {

    .results {

        grid-template-columns: 1fr;
    }

    .logo {

        font-size: 34px;
    }

    .card {

        min-height: 250px;
    }
}


@media (max-width: 500px) {

    .container {

        padding:
            16px 10px
            calc(35px + env(safe-area-inset-bottom));
    }

    .header {

        margin-bottom: 18px;
    }

    .logo {

        font-size: 31px;
    }

    .subtitle {

        font-size: 14px;
    }

    .question-box {

        border-radius: 20px;

        padding: 13px;
    }

    textarea {

        min-height: 115px;

        font-size: 16px;
    }

    .button-row {

        flex-direction: column;
    }

    .clear-button {

        width: 100%;
    }

    .card {

        border-radius: 20px;
    }

    .provider {

        font-size: 21px;
    }

    .system-top {

        align-items: flex-start;

        flex-direction: column;
    }
}

</style>

</head>


<body>


<div class="container">


    <!-- =========================================
         HEADER
    ========================================== -->

    <div class="header">

        <div class="logo">
            اسأل Smart AI
        </div>

        <div class="subtitle">
            سؤال واحد — عدة نماذج ذكاء اصطناعي
        </div>

    </div>


    <!-- =========================================
         PROVIDER STATUS
    ========================================== -->

    <div class="system-bar">

        <div class="system-top">

            <div class="system-title">
                حالة مزودي الذكاء الاصطناعي
            </div>

            <div
                id="remaining"
                class="remaining"
            >
                الأسئلة المتبقية: —
            </div>

        </div>


        <div
            id="providersStatus"
            class="providers-status"
        >

            <div class="provider-status">
                <span class="dot"></span>
                جاري الفحص...
            </div>

        </div>

    </div>


    <!-- =========================================
         QUESTION
    ========================================== -->

    <div class="question-box">

        <textarea
            id="question"
            maxlength="10000"
            placeholder="اكتب سؤالك هنا..."
            autocomplete="off"
        ></textarea>


        <div class="button-row">

            <button
                id="askButton"
                class="ask-button"
            >
                اسأل Smart AI
            </button>


            <button
                id="clearButton"
                class="clear-button"
            >
                مسح
            </button>

        </div>

    </div>


    <!-- =========================================
         LOADING
    ========================================== -->

    <div
        id="loading"
        class="loading"
    >

        جاري الحصول على الإجابات

        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>

    </div>


    <!-- =========================================
         RESULTS
    ========================================== -->

    <div id="results">

        <div class="empty">

            <div class="empty-title">
                مرحبًا بك في Smart AI
            </div>

            اكتب سؤالًا واضغط على
            «اسأل Smart AI»

        </div>

    </div>


</div>


<script>

/* =====================================================
   SMART AI FRONTEND
===================================================== */


/* =====================================================
   WORKER
===================================================== */

const API_URL =
    "https://smart-ai.kaka10906.workers.dev/";


/* =====================================================
   USER ID
===================================================== */

function getUserId() {

    let userId =
        localStorage.getItem("smartAI_userId");


    if (!userId) {

        userId =
            "user-" +
            crypto.randomUUID();


        localStorage.setItem(
            "smartAI_userId",
            userId
        );
    }


    return userId;
}


const USER_ID =
    getUserId();


/* =====================================================
   ELEMENTS
===================================================== */

const questionElement =
    document.getElementById("question");

const askButton =
    document.getElementById("askButton");

const clearButton =
    document.getElementById("clearButton");

const loading =
    document.getElementById("loading");

const results =
    document.getElementById("results");

const providersStatus =
    document.getElementById(
        "providersStatus"
    );

const remainingElement =
    document.getElementById(
        "remaining"
    );


/* =====================================================
   STARTUP
===================================================== */

loadProviderStatus();


/* =====================================================
   STATUS
===================================================== */

async function loadProviderStatus() {

    try {

        const response =
            await fetch(
                API_URL + "status"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                "Status request failed"
            );
        }


        displayProviderStatus(data);


        updateRemaining(data);

    }
    catch (error) {

        providersStatus.innerHTML = `

            <div class="provider-status">
                <span class="dot"></span>
                تعذر قراءة حالة المزودين
            </div>

        `;

    }

}


/* =====================================================
   DISPLAY STATUS
===================================================== */

function displayProviderStatus(data) {

    const providers =
        data?.providers ||
        data?.provider_status ||
        data?.status ||
        {};


    const names = [
        "deepseek",
        "gemini",
        "mistral"
    ];


    providersStatus.innerHTML = "";


    let found = false;


    names.forEach(function(name) {

        const info =
            providers[name];


        if (!info) {

            return;
        }


        found = true;


        const state =
            typeof info === "string"
                ? info
                : (
                    info.status ||
                    info.state ||
                    "unknown"
                );


        const normalized =
            String(state).toLowerCase();


        let label =
            "غير معروف";

        let className =
            "";


        if (
            normalized === "available"
        ) {

            label = "متاح";

            className =
                "available";

        }
        else if (
            normalized === "limited"
        ) {

            label = "محدود";

            className =
                "limited";

        }
        else if (
            normalized === "unavailable" ||
            normalized === "error"
        ) {

            label = "غير متاح";

            className =
                "unavailable";
        }


        const displayName =
            name === "deepseek"
                ? "DeepSeek"
                : name === "gemini"
                    ? "Gemini"
                    : "Mistral";


        providersStatus.innerHTML += `

            <div
                class="provider-status ${className}"
            >

                <span class="dot"></span>

                ${displayName}:
                ${label}

            </div>

        `;

    });


    if (!found) {

        providersStatus.innerHTML = `

            <div class="provider-status">

                <span class="dot"></span>

                لم تصل حالة المزودين

            </div>

        `;

    }

}


/* =====================================================
   REMAINING QUESTIONS
===================================================== */

function updateRemaining(data) {

    const remaining =
        findRemaining(data);


    if (
        remaining !== null &&
        remaining !== undefined
    ) {

        remainingElement.textContent =
            "الأسئلة المتبقية: " +
            remaining;

        return;
    }


    /*
       إذا لم يرسل الـ Worker
       عدد الأسئلة المتبقية،
       نتركها كما هي.
    */

}


/* =====================================================
   FIND REMAINING
===================================================== */

function findRemaining(data) {

    const possibleValues = [

        data?.remaining,

        data?.questionsRemaining,

        data?.remainingQuestions,

        data?.quota?.remaining,

        data?.usage?.remaining,

        data?.user?.remaining,

        data?.user?.questionsRemaining,

        data?.summary?.remaining

    ];


    for (
        const value of possibleValues
    ) {

        if (
            value !== undefined &&
            value !== null
        ) {

            return value;
        }

    }


    return null;
}


/* =====================================================
   ASK SMART AI
===================================================== */

async function askSmartAI() {

    const question =
        questionElement.value.trim();


    if (!question) {

        alert(
            "اكتب السؤال أولًا."
        );

        questionElement.focus();

        return;
    }


    askButton.disabled = true;

    askButton.textContent =
        "جاري السؤال...";


    loading.classList.add(
        "show"
    );


    results.innerHTML = `

        ${createLoadingCard(
            "Gemini"
        )}

        ${createLoadingCard(
            "Mistral"
        )}

    `;


    const startTime =
        performance.now();


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            userId:
                                USER_ID,

                            question:
                                question

                        })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data?.error ||
                data?.message ||
                "حدث خطأ في الاتصال."
            );

        }


        const elapsed =
            (
                (
                    performance.now() -
                    startTime
                ) / 1000
            ).toFixed(2);


        updateRemaining(data);


        displayResults(
            data,
            elapsed
        );


        /*
           بعد السؤال نعيد فحص الحالة
           لأن حالة المزود قد تتغير.
        */

        loadProviderStatus();

    }
    catch (error) {

        results.innerHTML = `

            <div class="empty">

                <div class="empty-title">
                    تعذر الحصول على الإجابة
                </div>

                ${escapeHTML(
                    error?.message ||
                    "حدث خطأ غير معروف."
                )}

            </div>

        `;

    }
    finally {

        askButton.disabled = false;

        askButton.textContent =
            "اسأل Smart AI";

        loading.classList.remove(
            "show"
        );

    }

}


/* =====================================================
   DISPLAY RESULTS
===================================================== */

function displayResults(
    data,
    elapsed
) {

    const resultData =
        data?.results || {};


    const deepseek =
        resultData.deepseek;


    const gemini =
        resultData.gemini;


    const mistral =
        resultData.mistral;


    const successful =
        data?.summary?.successful ??
        countSuccessful(
            resultData
        );


    const total =
        data?.summary?.total ??
        countReturned(
            resultData
        );


    let cards = "";


    /*
       DeepSeek يظهر فقط إذا أرسل الـ Worker
       نتيجة له.

       إذا كان unavailable وتم استبعاده،
       لن نعرض بطاقة فشل له.
    */

    if (deepseek) {

        cards +=
            createProviderCard(
                "DeepSeek",
                deepseek
            );

    }


    if (gemini) {

        cards +=
            createProviderCard(
                "Gemini",
                gemini
            );

    }


    if (mistral) {

        cards +=
            createProviderCard(
                "Mistral",
                mistral
            );

    }


    if (!cards) {

        cards = `

            <div class="empty">

                <div class="empty-title">
                    لم تصل أي إجابة
                </div>

                حاول مرة أخرى لاحقًا.

            </div>

        `;

    }


    cards += `

        <div class="summary">

            تم الحصول على

            <strong>
                ${successful}
            </strong>

            من

            <strong>
                ${total}
            </strong>

            إجابات

            — زمن الطلب:

            <strong>
                ${elapsed} ثانية
            </strong>

        </div>

    `;


    results.innerHTML =
        cards;

}


/* =====================================================
   COUNT SUCCESSFUL
===================================================== */

function countSuccessful(
    resultData
) {

    return Object.values(
        resultData
    ).filter(function(result) {

        return result &&
            result.ok === true;

    }).length;

}


/* =====================================================
   COUNT RETURNED
===================================================== */

function countReturned(
    resultData
) {

    return Object.keys(
        resultData
    ).length;

}


/* =====================================================
   PROVIDER CARD
===================================================== */

function createProviderCard(
    provider,
    result
) {

    if (!result) {

        return "";
    }


    if (result.ok) {

        const answer =
            result.answer || "";


        return `

            <div class="card">

                <div class="card-header">

                    <div class="provider">
                        ${provider}
                    </div>

                    <div class="status success">
                        نجح
                    </div>

                </div>


                <div class="answer-area">

                    <div class="answer">

                        ${escapeHTML(
                            answer
                        )}

                    </div>

                </div>


                <div class="card-footer">

                    <div class="model">

                        ${escapeHTML(
                            result.model || ""
                        )}

                    </div>


                    <button
                        class="copy-button"
                        onclick='copyAnswer(
                            ${JSON.stringify(
                                answer
                            )},
                            this
                        )'
                    >
                        نسخ
                    </button>

                </div>

            </div>

        `;

    }


    let error =
        result.error ||
        result.message ||
        "حدث خطأ.";


    const lowerError =
        String(error).toLowerCase();


    if (
        lowerError.includes(
            "insufficient balance"
        )
    ) {

        error =
            "الرصيد غير كافٍ لاستخدام هذه المنصة.";

    }


    if (
        lowerError.includes(
            "api key"
        )
    ) {

        error =
            "مفتاح API غير مضبوط.";

    }


    if (
        lowerError.includes(
            "402"
        )
    ) {

        error =
            "الرصيد غير كافٍ حاليًا.";

    }


    return `

        <div class="card">

            <div class="card-header">

                <div class="provider">
                    ${provider}
                </div>

                <div class="status error">
                    فشل
                </div>

            </div>


            <div class="answer-area">

                <div class="error-message">

                    ${escapeHTML(
                        error
                    )}

                </div>

            </div>


            <div class="card-footer">

                <div class="model">

                    ${escapeHTML(
                        result.model || ""
                    )}

                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   LOADING CARD
===================================================== */

function createLoadingCard(
    provider
) {

    return `

        <div class="card">

            <div class="card-header">

                <div class="provider">
                    ${provider}
                </div>

                <div class="status loading-status">
                    جاري...
                </div>

            </div>


            <div class="answer-area">

                <div class="answer">

                    جاري انتظار الإجابة...

                </div>

            </div>

        </div>

    `;

}


/* =====================================================
   COPY
===================================================== */

async function copyAnswer(
    text,
    button
) {

    try {

        await navigator.clipboard.writeText(
            text
        );


        const oldText =
            button.textContent;


        button.textContent =
            "تم النسخ ✓";


        setTimeout(
            function() {

                button.textContent =
                    oldText;

            },
            1500
        );

    }
    catch (error) {

        alert(
            "تعذر نسخ الإجابة."
        );

    }

}


/* =====================================================
   CLEAR
===================================================== */

function clearAll() {

    questionElement.value = "";


    results.innerHTML = `

        <div class="empty">

            <div class="empty-title">
                مرحبًا بك في Smart AI
            </div>

            اكتب سؤالًا واضغط على
            «اسأل Smart AI»

        </div>

    `;


    questionElement.focus();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =====================================================
   BUTTON EVENTS
===================================================== */

askButton.addEventListener(
    "click",
    askSmartAI
);


clearButton.addEventListener(
    "click",
    clearAll
);


/* =====================================================
   ENTER
===================================================== */

questionElement.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            askSmartAI();

        }

    }
);

</script>
