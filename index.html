<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Smart AI</title>

<style>
*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:linear-gradient(180deg,#eef1f5 0%,#f8f9fb 100%);
    color:#111827;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:25px 16px calc(50px + env(safe-area-inset-bottom));
}

.header{text-align:center;margin-bottom:24px}

.logo{font-size:40px;font-weight:900;letter-spacing:-1.5px}

.subtitle{margin-top:6px;color:#6b7280;font-size:15px}

.system-bar{
    background:white;border-radius:20px;padding:17px;margin-bottom:18px;
    box-shadow:0 7px 25px rgba(0,0,0,.05);
}

.system-top{
    display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px;
}

.system-title{font-weight:900;font-size:18px}

.remaining{
    font-size:14px;font-weight:800;color:#374151;background:#f3f4f6;
    padding:7px 12px;border-radius:22px;white-space:nowrap;
}

.providers-status{display:flex;flex-wrap:wrap;gap:8px}

.provider-status{
    display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:22px;
    background:#f3f4f6;color:#6b7280;font-size:13px;font-weight:800;
}

.provider-status.available{background:#dcfce7;color:#166534}
.provider-status.unavailable,.provider-status.error{background:#fee2e2;color:#991b1b}
.provider-status.limited{background:#fef3c7;color:#92400e}

.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}

.question-box{
    background:white;border-radius:24px;padding:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.07);margin-bottom:20px;
}

textarea{
    width:100%;
    min-height:125px;
    max-height:45vh;
    resize:vertical;
    border:2px solid #e5e7eb;
    border-radius:17px;
    padding:16px;
    font-family:inherit;
    font-size:17px;
    line-height:1.7;
    outline:none;
    direction:rtl;
    text-align:right;
    transition:border .2s,box-shadow .2s;
    overflow-y:auto;
    overflow-wrap:anywhere;
    word-break:break-word;
}

textarea:focus{
    border-color:#111827;
    box-shadow:0 0 0 3px rgba(17,24,39,.07);
}

textarea::placeholder{color:#9ca3af}

.image-preview{
    display:none;
    margin-top:10px;
    padding:10px;
    border:1px solid #e5e7eb;
    border-radius:15px;
    background:#f9fafb;
    align-items:center;
    gap:10px;
}

.image-preview.show{display:flex}

.image-preview img{
    width:58px;
    height:58px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid #e5e7eb;
}

.image-info{
    flex:1;
    min-width:0;
}

.image-name{
    font-size:13px;
    font-weight:800;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.image-note{
    font-size:11px;
    color:#9ca3af;
    margin-top:3px;
}

.remove-image{
    padding:7px 10px;
    background:#fee2e2;
    color:#991b1b;
    font-size:12px;
}

.button-row{
    display:flex;
    gap:10px;
    margin-top:13px;
}

button{
    border:none;
    font-family:inherit;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    border-radius:14px;
    padding:14px 20px;
    transition:transform .15s,opacity .15s,background .15s;
}

button:active{transform:scale(.98)}

.ask-button{flex:1;background:#111827;color:white}
.ask-button:hover{background:#1f2937}
.ask-button:disabled{opacity:.55;cursor:not-allowed}

.clear-button{background:#e5e7eb;color:#111827}
.clear-button:hover{background:#dfe2e6}

.image-button{
    background:#eef2ff;
    color:#3730a3;
    padding-left:16px;
    padding-right:16px;
}

.image-button:hover{background:#e0e7ff}

.loading{
    display:none;background:white;border-radius:16px;padding:14px;margin-bottom:18px;
    text-align:center;color:#6b7280;box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.loading.show{display:block}

.loading-dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;background:#6b7280;
    margin:0 3px;animation:pulse 1s infinite;
}

.loading-dot:nth-child(2){animation-delay:.15s}
.loading-dot:nth-child(3){animation-delay:.30s}

@keyframes pulse{
    0%,100%{opacity:.3}
    50%{opacity:1}
}

#results{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.card{
    background:white;border-radius:22px;padding:18px;min-height:300px;
    display:flex;flex-direction:column;min-width:0;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
}

.card-header{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding-bottom:14px;border-bottom:1px solid #edf0f3;
}

.provider{font-size:22px;font-weight:900}

.status{
    font-size:13px;font-weight:800;padding:6px 11px;border-radius:30px;
    background:#f3f4f6;color:#6b7280;white-space:nowrap;
}

.status.success{background:#dcfce7;color:#166534}
.status.error{background:#fee2e2;color:#991b1b}
.status.loading-status{background:#f3f4f6;color:#6b7280}

.answer-area{
    flex:1;padding-top:18px;min-width:0;
}

.answer{
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    word-break:break-word;
    max-width:100%;
    line-height:1.9;
    font-size:17px;
    direction:rtl;
    text-align:right;
}

.error-message{
    color:#991b1b;font-size:16px;line-height:1.8;
    overflow-wrap:anywhere;word-break:break-word;
}

.card-footer{
    margin-top:18px;padding-top:12px;border-top:1px solid #edf0f3;
    display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0;
}

.model{
    color:#9ca3af;font-size:11px;direction:ltr;text-align:left;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;
}

.copy-button{
    padding:7px 11px;background:#f3f4f6;color:#374151;font-size:12px;white-space:nowrap;
}

.copy-button:hover{background:#e5e7eb}

.empty{
    grid-column:1 / -1;background:white;border-radius:22px;padding:45px 20px;
    text-align:center;color:#9ca3af;box-shadow:0 8px 25px rgba(0,0,0,.05);
}

.empty-title{color:#374151;font-size:20px;font-weight:800;margin-bottom:8px}

.summary{
    grid-column:1 / -1;background:white;border-radius:18px;padding:13px 16px;
    text-align:center;color:#6b7280;font-size:14px;box-shadow:0 5px 20px rgba(0,0,0,.04);
}

.summary strong{color:#111827}

@media (max-width:850px){
    #results{grid-template-columns:1fr}
    .logo{font-size:34px}
    .card{min-height:250px}
}

@media (max-width:500px){
    .container{padding:16px 10px calc(35px + env(safe-area-inset-bottom))}
    .header{margin-bottom:18px}
    .logo{font-size:31px}
    .subtitle{font-size:14px}
    .system-bar{border-radius:20px;padding:15px}
    .system-top{align-items:flex-start;flex-direction:column}
    .remaining{font-size:13px}
    .question-box{border-radius:20px;padding:13px}
    textarea{min-height:115px;font-size:16px}
    .button-row{flex-wrap:wrap}
    .ask-button{min-width:calc(100% - 70px)}
    .image-button{width:60px;padding-left:8px;padding-right:8px}
    .clear-button{width:100%}
    .card{border-radius:20px}
    .provider{font-size:21px}
}
</style>
</head>

<body>
<div class="container">

<div class="header">
    <div class="logo">اسأل Smart AI</div>
    <div class="subtitle">سؤال واحد — عدة نماذج ذكاء اصطناعي</div>
</div>

<div class="system-bar">
    <div class="system-top">
        <div class="system-title">حالة مزودي الذكاء الاصطناعي</div>
        <div id="remaining" class="remaining">الأسئلة المتبقية: —</div>
    </div>

    <div id="providersStatus" class="providers-status">
        <div class="provider-status">
            <span class="dot"></span>
            جاري الفحص...
        </div>
    </div>
</div>

<div class="question-box">

    <textarea
        id="question"
        maxlength="10000"
        placeholder="اكتب سؤالك هنا...&#10;اضغط Enter لسطر جديد، واضغط Ctrl+Enter أو ⌘+Enter للإرسال."
        autocomplete="off"
    ></textarea>

    <div id="imagePreview" class="image-preview">
        <img id="previewImage" alt="معاينة الصورة">
        <div class="image-info">
            <div id="imageName" class="image-name"></div>
            <div class="image-note">الصورة مرفقة بالرسالة</div>
        </div>
        <button id="removeImageButton" class="remove-image" type="button">إزالة</button>
    </div>

    <input
        id="imageInput"
        type="file"
        accept="image/*"
        hidden
    >

    <div class="button-row">
        <button id="askButton" class="ask-button" type="button">
            اسأل Smart AI
        </button>

        <button id="imageButton" class="image-button" type="button" title="إضافة صورة">
            🖼️
        </button>

        <button id="clearButton" class="clear-button" type="button">
            مسح
        </button>
    </div>

</div>

<div id="loading" class="loading">
    جاري الحصول على الإجابات
    <span class="loading-dot"></span>
    <span class="loading-dot"></span>
    <span class="loading-dot"></span>
</div>

<div id="results">
    <div class="empty">
        <div class="empty-title">مرحبًا بك في Smart AI</div>
        اكتب سؤالًا واضغط على «اسأل Smart AI»
    </div>
</div>

</div>


<!-- =========================================
     IMAGE LIGHTBOX
========================================== -->

<div id="imageLightbox" class="image-lightbox" role="dialog" aria-modal="true" aria-label="معاينة الصورة">

    <button
        id="lightboxClose"
        class="lightbox-close"
        type="button"
        aria-label="إغلاق"
    >×</button>

    <img id="lightboxImage" alt="الصورة بحجم كبير">

    <div class="lightbox-hint">
        اضغط خارج الصورة أو × للإغلاق
    </div>

</div>

<script>
"use strict";

/* =====================================================
   SMART AI FRONTEND
===================================================== */

const API_URL = "https://smart-ai.kaka10906.workers.dev/";

function getUserId(){
    let userId = localStorage.getItem("smartAI_userId");

    if(!userId){
        userId = "user-" + crypto.randomUUID();
        localStorage.setItem("smartAI_userId", userId);
    }

    return userId;
}

const USER_ID = getUserId();

const questionElement = document.getElementById("question");
const askButton = document.getElementById("askButton");
const clearButton = document.getElementById("clearButton");
const imageButton = document.getElementById("imageButton");
const imageInput = document.getElementById("imageInput");
const imagePreview = document.getElementById("imagePreview");
const previewImage = document.getElementById("previewImage");
const imageName = document.getElementById("imageName");
const removeImageButton = document.getElementById("removeImageButton");

const imageLightbox = document.getElementById("imageLightbox");
const lightboxImage = document.getElementById("lightboxImage");
const lightboxClose = document.getElementById("lightboxClose");

const loading = document.getElementById("loading");
const results = document.getElementById("results");
const providersStatus = document.getElementById("providersStatus");
const remainingElement = document.getElementById("remaining");

let selectedImage = null;

loadProviderStatus();
loadQuota();

/* =====================================================
   PROVIDER STATUS
===================================================== */

async function loadProviderStatus(){
    try{
        const response = await fetch(API_URL + "status");
        const data = await response.json();

        if(!response.ok){
            throw new Error("Status request failed");
        }

        displayProviderStatus(data);
    }catch(error){
        providersStatus.innerHTML = `
            <div class="provider-status">
                <span class="dot"></span>
                تعذر قراءة حالة المزودين
            </div>
        `;
    }
}

/* =====================================================
   QUOTA
===================================================== */

async function loadQuota(){
    try{
        const response = await fetch(
            API_URL + "quota?userId=" + encodeURIComponent(USER_ID)
        );

        const data = await response.json();

        if(!response.ok){
            throw new Error("Quota request failed");
        }

        updateRemaining(data);
    }catch(error){
        // لا نعرض خطأ للمستخدم.
    }
}

/* =====================================================
   PROVIDER STATUS DISPLAY
===================================================== */

function displayProviderStatus(data){
    const providers = data?.status?.providers || {};

    const names = ["deepseek","gemini","mistral"];

    providersStatus.innerHTML = "";

    let found = false;

    names.forEach(function(name){
        const info = providers[name];

        if(!info) return;

        found = true;

        const state =
            typeof info === "string"
                ? info
                : (info.status || "unknown");

        const normalized = String(state).toLowerCase();

        let label = "غير معروف";
        let className = "";

        if(normalized === "available"){
            label = "متاح";
            className = "available";
        }else if(normalized === "limited"){
            label = "محدود";
            className = "limited";
        }else if(
            normalized === "unavailable" ||
            normalized === "error"
        ){
            label = "غير متاح";
            className = "unavailable";
        }

        const displayName =
            name === "deepseek"
                ? "DeepSeek"
                : name === "gemini"
                    ? "Gemini"
                    : "Mistral";

        providersStatus.innerHTML += `
            <div class="provider-status ${className}">
                <span class="dot"></span>
                ${displayName}: ${label}
            </div>
        `;
    });

    if(!found){
        providersStatus.innerHTML = `
            <div class="provider-status">
                <span class="dot"></span>
                لم تصل حالة المزودين
            </div>
        `;
    }
}

/* =====================================================
   REMAINING
===================================================== */

function updateRemaining(data){
    const remaining = findRemaining(data);

    if(remaining !== null && remaining !== undefined){
        remainingElement.textContent =
            "الأسئلة المتبقية: " + remaining;
    }
}

function findRemaining(data){
    const possibleValues = [
        data?.remaining,
        data?.questionsRemaining,
        data?.remainingQuestions,
        data?.quota?.remaining,
        data?.usage?.remaining,
        data?.user?.remaining,
        data?.user?.questionsRemaining,
        data?.summary?.remaining
    ];

    for(const value of possibleValues){
        if(value !== undefined && value !== null){
            return value;
        }
    }

    return null;
}

/* =====================================================
   IMAGE
===================================================== */

imageButton.addEventListener("click", function(){
    imageInput.click();
});

imageInput.addEventListener("change", function(){
    const file = imageInput.files?.[0];

    if(!file){
        return;
    }

    if(!file.type || !file.type.startsWith("image/")){
        alert("الملف المختار ليس صورة.");
        imageInput.value = "";
        return;
    }

    selectedImage = file;

    /*
     * نستخدم FileReader بدل Object URL حتى تكون
     * المعاينة موثوقة على iPhone/iPad سواء كانت
     * الصورة من الاستوديو أو ملتقطة بالكاميرا.
     */
    const reader = new FileReader();

    reader.onload = function(event){
        previewImage.src = event.target.result;
        imageName.textContent =
            file.name || "صورة مرفقة";

        imagePreview.classList.add("show");
    };

    reader.onerror = function(){
        selectedImage = null;
        imageInput.value = "";
        previewImage.removeAttribute("src");
        imagePreview.classList.remove("show");

        alert("تعذر معاينة الصورة.");
    };

    reader.readAsDataURL(file);
});

removeImageButton.addEventListener("click", removeSelectedImage);

function removeSelectedImage(){
    selectedImage = null;
    imageInput.value = "";
    previewImage.removeAttribute("src");
    imageName.textContent = "";
    imagePreview.classList.remove("show");
    closeImageLightbox();
}

/* =====================================================
   IMAGE LIGHTBOX
===================================================== */

previewImage.addEventListener("click", function(){
    if(!previewImage.src){
        return;
    }

    lightboxImage.src = previewImage.src;
    imageLightbox.classList.add("show");
    document.body.style.overflow = "hidden";
});

function closeImageLightbox(){
    imageLightbox.classList.remove("show");
    lightboxImage.removeAttribute("src");
    document.body.style.overflow = "";
}

lightboxClose.addEventListener("click", closeImageLightbox);

imageLightbox.addEventListener("click", function(event){
    if(event.target === imageLightbox){
        closeImageLightbox();
    }
});

document.addEventListener("keydown", function(event){
    if(event.key === "Escape" && imageLightbox.classList.contains("show")){
        closeImageLightbox();
    }
});

/* =====================================================
   ASK
===================================================== */

async function askSmartAI(){

    const question = questionElement.value.trim();

    if(!question){
        alert("اكتب السؤال أولًا.");
        questionElement.focus();
        return;
    }

    askButton.disabled = true;
    imageButton.disabled = true;
    clearButton.disabled = true;

    askButton.textContent = "جاري السؤال...";
    loading.classList.add("show");

    results.innerHTML = `
        ${createLoadingCard("Gemini")}
        ${createLoadingCard("Mistral")}
    `;

    const startTime = performance.now();

    try{
        /*
         * Worker الحالي يستقبل question و userId.
         * لذلك لا نرسل الصورة إلى Worker بعد.
         * نحتفظ بها في الواجهة حتى نضيف دعم الصور
         * في Worker في المرحلة التالية.
         */
        const response = await fetch(API_URL,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                userId:USER_ID,
                question:question
            })
        });

        const data = await response.json();

        if(!response.ok){
            throw new Error(
                data?.error ||
                data?.message ||
                "حدث خطأ في الاتصال."
            );
        }

        const elapsed = (
            (performance.now() - startTime) / 1000
        ).toFixed(2);

        updateRemaining(data);
        displayResults(data,elapsed);

        await loadProviderStatus();

    }catch(error){
        results.innerHTML = `
            <div class="empty">
                <div class="empty-title">
                    تعذر الحصول على الإجابة
                </div>
                ${escapeHTML(
                    error?.message ||
                    "حدث خطأ غير معروف."
                )}
            </div>
        `;
    }finally{
        askButton.disabled = false;
        imageButton.disabled = false;
        clearButton.disabled = false;

        askButton.textContent = "اسأل Smart AI";
        loading.classList.remove("show");
    }
}

/* =====================================================
   RESULTS
===================================================== */

function displayResults(data,elapsed){

    const resultData = data?.results || {};

    const deepseek = resultData.deepseek;
    const gemini = resultData.gemini;
    const mistral = resultData.mistral;

    const successful =
        data?.summary?.successful ??
        countSuccessful(resultData);

    const total =
        data?.summary?.total ??
        countReturned(resultData);

    let cards = "";

    if(deepseek){
        cards += createProviderCard("DeepSeek",deepseek);
    }

    if(gemini){
        cards += createProviderCard("Gemini",gemini);
    }

    if(mistral){
        cards += createProviderCard("Mistral",mistral);
    }

    if(!cards){
        cards = `
            <div class="empty">
                <div class="empty-title">لم تصل أي إجابة</div>
                حاول مرة أخرى لاحقًا.
            </div>
        `;
    }

    cards += `
        <div class="summary">
            تم الحصول على
            <strong>${successful}</strong>
            من
            <strong>${total}</strong>
            إجابات
            — زمن الطلب:
            <strong>${elapsed}</strong>
            ثانية
        </div>
    `;

    results.innerHTML = cards;
}

function countSuccessful(resultData){
    return Object.values(resultData).filter(function(result){
        return result && result.ok === true;
    }).length;
}

function countReturned(resultData){
    return Object.values(resultData).filter(function(result){
        return result !== null;
    }).length;
}

/* =====================================================
   PROVIDER CARD
===================================================== */

function createProviderCard(provider,result){

    if(!result){
        return "";
    }

    if(result.ok){

        const answer = result.answer || "";

        return `
            <div class="card">
                <div class="card-header">
                    <div class="provider">${provider}</div>
                    <div class="status success">نجح</div>
                </div>

                <div class="answer-area">
                    <div class="answer">
                        ${escapeHTML(answer)}
                    </div>
                </div>

                <div class="card-footer">
                    <div class="model">
                        ${escapeHTML(result.model || "")}
                    </div>

                    <button
                        class="copy-button"
                        onclick='copyAnswer(
                            ${JSON.stringify(answer)},
                            this
                        )'
                    >
                        نسخ
                    </button>
                </div>
            </div>
        `;
    }

    let error =
        result.error ||
        result.message ||
        "حدث خطأ.";

    const lowerError = String(error).toLowerCase();

    if(lowerError.includes("insufficient balance")){
        error = "الرصيد غير كافٍ لاستخدام هذه المنصة.";
    }

    if(lowerError.includes("api key")){
        error = "مفتاح API غير مضبوط.";
    }

    if(lowerError.includes("402")){
        error = "الرصيد غير كافٍ حاليًا.";
    }

    return `
        <div class="card">
            <div class="card-header">
                <div class="provider">${provider}</div>
                <div class="status error">فشل</div>
            </div>

            <div class="answer-area">
                <div class="error-message">
                    ${escapeHTML(error)}
                </div>
            </div>

            <div class="card-footer">
                <div class="model">
                    ${escapeHTML(result.model || "")}
                </div>
            </div>
        </div>
    `;
}

/* =====================================================
   LOADING CARD
===================================================== */

function createLoadingCard(provider){
    return `
        <div class="card">
            <div class="card-header">
                <div class="provider">${provider}</div>
                <div class="status loading-status">جاري...</div>
            </div>

            <div class="answer-area">
                <div class="answer">
                    جاري انتظار الإجابة...
                </div>
            </div>
        </div>
    `;
}

/* =====================================================
   COPY
===================================================== */

async function copyAnswer(text,button){

    try{
        await navigator.clipboard.writeText(text);

        const oldText = button.textContent;
        button.textContent = "تم النسخ ✓";

        setTimeout(function(){
            button.textContent = oldText;
        },1500);

    }catch(error){
        alert("تعذر نسخ الإجابة.");
    }
}

/* =====================================================
   CLEAR
===================================================== */

function clearAll(){

    questionElement.value = "";
    removeSelectedImage();

    results.innerHTML = `
        <div class="empty">
            <div class="empty-title">
                مرحبًا بك في Smart AI
            </div>
            اكتب سؤالًا واضغط على «اسأل Smart AI»
        </div>
    `;

    questionElement.focus();
}

/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(text){
    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

/* =====================================================
   BUTTONS
===================================================== */

askButton.addEventListener("click",askSmartAI);
clearButton.addEventListener("click",clearAll);

/* =====================================================
   KEYBOARD
   Enter = سطر جديد
   Ctrl+Enter / Cmd+Enter = إرسال
===================================================== */

questionElement.addEventListener("keydown",function(event){

    if(
        event.key === "Enter" &&
        (event.ctrlKey || event.metaKey)
    ){
        event.preventDefault();
        askSmartAI();
    }

});
</script>
