<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    180deg,
                    #eef1f5 0%,
                    #f8f9fb 100%
                );

            color: #111827;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 24px 16px 50px;
        }

        /* =========================================
           HEADER
        ========================================= */

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .subtitle {
            margin-top: 6px;
            color: #6b7280;
            font-size: 15px;
        }

        /* =========================================
           QUESTION BOX
        ========================================= */

        .question-box {
            background: white;
            border-radius: 24px;
            padding: 18px;

            box-shadow:
                0 10px 35px rgba(0,0,0,0.07);

            margin-bottom: 22px;
        }

        textarea {
            width: 100%;
            min-height: 125px;

            resize: vertical;

            border: 2px solid #e5e7eb;
            border-radius: 17px;

            padding: 16px;

            font-family: inherit;
            font-size: 17px;
            line-height: 1.7;

            outline: none;

            direction: rtl;

            transition: border 0.2s;
        }

        textarea:focus {
            border-color: #111827;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 13px;
        }

        button {
            border: none;
            font-family: inherit;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            border-radius: 14px;
            padding: 14px 20px;
        }

        .ask-button {
            flex: 1;
            background: #111827;
            color: white;
        }

        .ask-button:active {
            transform: scale(0.99);
        }

        .ask-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .clear-button {
            background: #e5e7eb;
            color: #111827;
        }

        /* =========================================
           LOADING
        ========================================= */

        .loading {
            display: none;

            background: white;
            border-radius: 16px;

            padding: 14px;

            margin-bottom: 18px;

            text-align: center;

            color: #6b7280;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.05);
        }

        .loading.show {
            display: block;
        }

        .loading-dot {
            display: inline-block;

            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #6b7280;

            margin: 0 3px;

            animation: pulse 1s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.15s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.30s;
        }

        @keyframes pulse {

            0%, 100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }

        }

        /* =========================================
           RESULTS
        ========================================= */

        .results {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;
        }

        /* =========================================
           CARD
        ========================================= */

        .card {
            background: white;

            border-radius: 22px;

            padding: 18px;

            min-height: 300px;

            display: flex;
            flex-direction: column;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.06);
        }

        .card-header {
            display: flex;

            justify-content: space-between;
            align-items: center;

            padding-bottom: 14px;

            border-bottom:
                1px solid #edf0f3;
        }

        .provider {
            font-size: 22px;
            font-weight: 900;
        }

        .status {
            font-size: 13px;
            font-weight: 800;

            padding: 6px 11px;

            border-radius: 30px;

            background: #f3f4f6;
            color: #6b7280;
        }

        .status.success {
            background: #dcfce7;
            color: #166534;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }

        .status.loading {
            background: #f3f4f6;
            color: #6b7280;
        }

        /* =========================================
           ANSWER
        ========================================= */

        .answer-area {
            flex: 1;

            padding-top: 18px;

            display: flex;
            flex-direction: column;
        }

        .answer {
            white-space: pre-wrap;

            word-break: break-word;

            line-height: 1.9;

            font-size: 17px;

            direction: rtl;

            text-align: right;
        }

        .error-message {
            color: #991b1b;

            font-size: 16px;

            line-height: 1.8;
        }

        /* =========================================
           CARD FOOTER
        ========================================= */

        .card-footer {
            margin-top: 18px;

            padding-top: 12px;

            border-top:
                1px solid #edf0f3;

            display: flex;

            justify-content: space-between;
            align-items: center;

            gap: 10px;
        }

        .model {
            color: #9ca3af;

            font-size: 11px;

            direction: ltr;

            text-align: left;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        .copy-button {
            padding: 7px 11px;

            background: #f3f4f6;

            color: #374151;

            font-size: 12px;

            white-space: nowrap;
        }

        .copy-button:hover {
            background: #e5e7eb;
        }

        /* =========================================
           EMPTY
        ========================================= */

        .empty {
            grid-column: 1 / -1;

            background: white;

            border-radius: 22px;

            padding: 45px 20px;

            text-align: center;

            color: #9ca3af;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.05);
        }

        .empty-title {
            color: #374151;

            font-size: 20px;

            font-weight: 800;

            margin-bottom: 8px;
        }

        /* =========================================
           SUMMARY
        ========================================= */

        .summary {
            grid-column: 1 / -1;

            background: white;

            border-radius: 18px;

            padding: 13px 16px;

            text-align: center;

            color: #6b7280;

            font-size: 14px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.04);
        }

        .summary strong {
            color: #111827;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 850px) {

            .results {
                grid-template-columns: 1fr;
            }

            .logo {
                font-size: 32px;
            }

            .card {
                min-height: 250px;
            }

        }

        @media (max-width: 500px) {

            .container {
                padding:
                    16px 10px 35px;
            }

            .question-box {
                border-radius: 20px;
                padding: 13px;
            }

            textarea {
                min-height: 115px;
                font-size: 16px;
            }

            .button-row {
                flex-direction: column;
            }

            .clear-button {
                width: 100%;
            }

            .card {
                border-radius: 20px;
            }

            .provider {
                font-size: 21px;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- =========================================
         HEADER
    ========================================== -->

    <div class="header">

        <div class="logo">
            اسأل Smart AI
        </div>

        <div class="subtitle">
            سؤال واحد — عدة نماذج ذكاء اصطناعي
        </div>

    </div>


    <!-- =========================================
         QUESTION
    ========================================== -->

    <div class="question-box">

        <textarea
            id="question"
            maxlength="10000"
            placeholder="اكتب سؤالك هنا..."
        ></textarea>


        <div class="button-row">

            <button
                id="askButton"
                class="ask-button"
                onclick="askSmartAI()"
            >
                اسأل Smart AI
            </button>


            <button
                class="clear-button"
                onclick="clearAll()"
            >
                مسح
            </button>

        </div>

    </div>


    <!-- =========================================
         LOADING
    ========================================== -->

    <div
        id="loading"
        class="loading"
    >

        جاري الحصول على الإجابات

        <span class="loading-dot"></span>
        <span class="loading-dot"></span>
        <span class="loading-dot"></span>

    </div>


    <!-- =========================================
         RESULTS
    ========================================== -->

    <div id="results">

        <div class="empty">

            <div class="empty-title">
                مرحبًا بك في Smart AI
            </div>

            اكتب سؤالًا واضغط على
            «اسأل Smart AI»

        </div>

    </div>


</div>


<script>

    // =====================================================
    // WORKER
    // =====================================================

    const API_URL =
        "https://smart-ai.kaka10906.workers.dev/";


    // =====================================================
    // ASK
    // =====================================================

    async function askSmartAI() {

        const questionElement =
            document.getElementById("question");

        const askButton =
            document.getElementById("askButton");

        const loading =
            document.getElementById("loading");

        const results =
            document.getElementById("results");


        const question =
            questionElement.value.trim();


        if (!question) {

            alert("اكتب السؤال أولًا.");

            questionElement.focus();

            return;
        }


        // -------------------------------------------------
        // START
        // -------------------------------------------------

        askButton.disabled = true;

        askButton.textContent =
            "جاري السؤال...";

        loading.classList.add("show");


        // -------------------------------------------------
        // LOADING CARDS
        // -------------------------------------------------

        results.innerHTML = `

            ${createLoadingCard("DeepSeek")}

            ${createLoadingCard("Gemini")}

            ${createLoadingCard("Mistral")}

        `;


        const startTime =
            performance.now();


        try {

            // =============================================
            // REQUEST
            // =============================================

            const response =
                await fetch(
                    API_URL,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            question: question
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data?.error ||
                    "حدث خطأ في الاتصال."
                );

            }


            const endTime =
                performance.now();


            const elapsed =
                ((endTime - startTime) / 1000)
                .toFixed(2);


            displayResults(
                data,
                elapsed
            );


        }
        catch (error) {

            results.innerHTML = `

                <div class="empty">

                    <div class="empty-title">
                        تعذر الاتصال
                    </div>

                    ${escapeHTML(
                        error?.message ||
                        "حدث خطأ غير معروف."
                    )}

                </div>

            `;

        }
        finally {

            askButton.disabled = false;

            askButton.textContent =
                "اسأل Smart AI";

            loading.classList.remove("show");

        }

    }


    // =====================================================
    // DISPLAY RESULTS
    // =====================================================

    function displayResults(
        data,
        elapsed
    ) {

        const results =
            document.getElementById("results");


        const deepseek =
            data?.results?.deepseek;

        const gemini =
            data?.results?.gemini;

        const mistral =
            data?.results?.mistral;


        const successful =
            data?.summary?.successful ?? 0;

        const total =
            data?.summary?.total ?? 3;


        results.innerHTML = `

            ${createProviderCard(
                "DeepSeek",
                deepseek
            )}

            ${createProviderCard(
                "Gemini",
                gemini
            )}

            ${createProviderCard(
                "Mistral",
                mistral
            )}

            <div class="summary">

                تم الحصول على
                <strong>${successful}</strong>
                من
                <strong>${total}</strong>
                إجابات

                — زمن الطلب:
                <strong>${elapsed} ثانية</strong>

            </div>

        `;

    }


    // =====================================================
    // PROVIDER CARD
    // =====================================================

    function createProviderCard(
        provider,
        result
    ) {

        if (!result) {

            return `

                <div class="card">

                    <div class="card-header">

                        <div class="provider">
                            ${provider}
                        </div>

                        <div class="status error">
                            فشل
                        </div>

                    </div>

                    <div class="answer-area">

                        <div class="error-message">
                            لم تصل نتيجة من هذه المنصة.
                        </div>

                    </div>

                </div>

            `;

        }


        if (result.ok) {

            const answer =
                result.answer || "";


            return `

                <div class="card">

                    <div class="card-header">

                        <div class="provider">
                            ${provider}
                        </div>

                        <div class="status success">
                            نجح
                        </div>

                    </div>


                    <div class="answer-area">

                        <div class="answer">
                            ${escapeHTML(answer)}
                        </div>

                    </div>


                    <div class="card-footer">

                        <div class="model">
                            ${escapeHTML(
                                result.model || ""
                            )}
                        </div>

                        <button
                            class="copy-button"
                            onclick='copyAnswer(${JSON.stringify(answer)}, this)'
                        >
                            نسخ
                        </button>

                    </div>

                </div>

            `;

        }


        // =================================================
        // ERROR
        // =================================================

        let error =
            result.error ||
            "حدث خطأ.";


        // -------------------------------------------------
        // TRANSLATE COMMON ERRORS
        // -------------------------------------------------

        if (
            error
                .toLowerCase()
                .includes("insufficient balance")
        ) {

            error =
                "الرصيد غير كافٍ لاستخدام هذه المنصة.";

        }


        if (
            error
                .toLowerCase()
                .includes("api key")
        ) {

            error =
                "مفتاح API غير مضبوط.";

        }


        return `

            <div class="card">

                <div class="card-header">

                    <div class="provider">
                        ${provider}
                    </div>

                    <div class="status error">
                        فشل
                    </div>

                </div>


                <div class="answer-area">

                    <div class="error-message">
                        ${escapeHTML(error)}
                    </div>

                </div>


                <div class="card-footer">

                    <div class="model">
                        ${escapeHTML(
                            result.model || ""
                        )}
                    </div>

                </div>

            </div>

        `;

    }


    // =====================================================
    // LOADING CARD
    // =====================================================

    function createLoadingCard(
        provider
    ) {

        return `

            <div class="card">

                <div class="card-header">

                    <div class="provider">
                        ${provider}
                    </div>

                    <div class="status loading">
                        جاري...
                    </div>

                </div>


                <div class="answer-area">

                    <div class="answer">
                        جاري انتظار الإجابة...
                    </div>

                </div>

            </div>

        `;

    }


    // =====================================================
    // COPY
    // =====================================================

    async function copyAnswer(
        text,
        button
    ) {

        try {

            await navigator.clipboard.writeText(
                text
            );

            const oldText =
                button.textContent;

            button.textContent =
                "تم النسخ ✓";


            setTimeout(
                function() {

                    button.textContent =
                        oldText;

                },
                1500
            );

        }
        catch (error) {

            alert(
                "تعذر نسخ الإجابة."
            );

        }

    }


    // =====================================================
    // CLEAR
    // =====================================================

    function clearAll() {

        document.getElementById(
            "question"
        ).value = "";


        document.getElementById(
            "results"
        ).innerHTML = `

            <div class="empty">

                <div class="empty-title">
                    مرحبًا بك في Smart AI
                </div>

                اكتب سؤالًا واضغط على
                «اسأل Smart AI»

            </div>

        `;


        document.getElementById(
            "question"
        ).focus();

    }


    // =====================================================
    // ESCAPE HTML
    // =====================================================

    function escapeHTML(text) {

        return String(text)

            .replaceAll(
                "&",
                "&amp;"
            )

            .replaceAll(
                "<",
                "&lt;"
            )

            .replaceAll(
                ">",
                "&gt;"
            )

            .replaceAll(
                '"',
                "&quot;"
            )

            .replaceAll(
                "'",
                "&#039;"
            );

    }


    // =====================================================
    // ENTER
    // =====================================================

    document
        .getElementById("question")
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    askSmartAI();

                }

            }
        );

</script>

</body>

</html>
